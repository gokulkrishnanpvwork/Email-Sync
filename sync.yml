name: Heyzine Reader Sync

on:
  schedule:
     - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run sync
        env:
          HEYZINE_CURL: ${{ secrets.HEYZINE_CURL }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
           GOOGLE_API_KEY: ${{secrets.GOOGLESHEETAPI}}
        run: python3 cron_sync.py
